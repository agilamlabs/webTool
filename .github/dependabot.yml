version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Kolkata
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: mcp
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Kolkata
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
