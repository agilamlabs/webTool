name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow on-demand triggering of the live-web drift job without a push.
  workflow_dispatch:
  # Nightly run -- catches drift in upstream search engines / CAPTCHA
  # behavior + Playwright browser releases without blocking PRs.
  schedule:
    - cron: "0 7 * * *"  # 07:00 UTC daily

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check web_agent tests

      - name: Ruff format check
        run: python -m ruff format --check web_agent tests

      - name: Mypy
        run: python -m mypy web_agent

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests with coverage
        # Both real-browser suites are excluded by pyproject addopts and run
        # in their dedicated jobs below. Mocked browser tests still run here.
        # Tee output to a file so the failure step below can publish it to
        # the publicly-visible job summary even when raw logs require auth.
        run: |
          set -o pipefail
          python -m pytest -v --tb=long \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml 2>&1 | tee pytest-output.txt

      - name: Publish pytest output to job summary on failure
        if: failure()
        run: |
          {
            echo "## Pytest failure tail (Python ${{ matrix.python-version }})"
            echo ""
            echo '```'
            tail -n 300 pytest-output.txt || echo "no pytest-output.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pytest output artifact on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-output-py${{ matrix.python-version }}
          path: pytest-output.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  integration-deterministic:
    name: Integration deterministic (local Chromium)
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Playwright Chromium + system deps
        run: python -m playwright install --with-deps chromium

      - name: Run deterministic browser integration tests
        run: |
          python -m pytest tests/test_integration_deterministic.py \
            -m integration_deterministic -v --tb=short --maxfail=1

      - name: Upload deterministic integration artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-deterministic-debug
          path: |
            debug/
            screenshots/
          retention-days: 3
          if-no-files-found: ignore

  integration-live-web:
    name: Integration live web (ecosystem drift)
    # Skip on PRs -- search engines can serve CAPTCHAs from CI's IPs
    # and that flakiness shouldn't block legitimate PR merges. Runs on
    # push-to-main (post-merge sanity), nightly schedule (catch drift),
    # and manual dispatch.
    if: github.event_name != 'pull_request'
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Don't fail the overall workflow if an external service flakes; this
    # job's value is drift signal, not merge gating.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Playwright Chromium + system deps
        run: |
          python -m playwright install --with-deps chromium

      - name: Run live-web integration tests
        # Select by marker so local deterministic tests never call external
        # services and live-web drift does not duplicate the PR gate.
        run: |
          python -m pytest -m integration_live_web \
            -v --tb=short --maxfail=5 --durations=10

      - name: Upload live-web integration artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-live-web-debug
          path: |
            debug/
            screenshots/
          retention-days: 3
          if-no-files-found: ignore
